@if (showButton()) {
<button type="button" (click)="scrollToTop()" aria-label="Back to top"
    class="fixed right-6 bottom-6 z-50 grid size-11 place-items-center rounded-full border border-lime bg-ink text-lime shadow-[0_10px_30px_rgba(0,0,0,0.25)] transition hover:-translate-y-1 hover:bg-lime hover:text-ink">
    ↑
</button>
}
